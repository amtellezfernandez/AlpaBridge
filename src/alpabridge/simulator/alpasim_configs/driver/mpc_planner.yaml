# Public dependency-light MPC-style planner for AlpaSim.
# Forward-simulates candidate control sequences through a simple ego dynamics
# model and scores each against real-time route/hazard/speed signal - no
# checkpoint, proxy, torch model, or private experiment artifact. Demonstrates
# a genuinely different "how does the action get decided" shape than the
# other baselines: a real (if small) receding-horizon search, not a
# closed-form formula.

defaults:
  - _self_

log_level: ${wizard.log_level}  # keep the driver log level aligned with wizard

model:
  model_type: mpc_planner
  device: "cpu"
  checkpoint_path: "unused-public-baseline"

host: "0.0.0.0"  # external-driver bind address inside the runtime container
port: 6789       # overwritten by alpabridge-launch when --port is supplied

inference:
  use_cameras:  # camera validation still exercises the external-driver contract
    - camera_front_wide_120fov
  max_batch_size: 1
  subsample_factor: 1
  context_length: 1
  output_frequency_hz: 4

route:
  default_command: 2  # straight fallback when the simulator omits a command
  use_waypoint_commands: true
  command_distance_threshold: 2.0
  min_lookahead_distance: 20.0

output_dir: "/mnt/output/driver"  # overwritten by alpabridge-launch

trajectory_optimizer:
  enabled: false

plot_debug_images: false
